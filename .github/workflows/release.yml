name: source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - run: dotnet restore RealTimeTranslation.slnx --locked-mode
      - run: dotnet format RealTimeTranslation.slnx --verify-no-changes --no-restore
      - run: dotnet build RealTimeTranslation.slnx --configuration Release --no-restore
      - run: dotnet test RealTimeTranslation.slnx --configuration Release --no-build
